<script>
(()=>{const D=JSON.parse(document.getElementById("pd").textContent),u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),SK="studio-k";
async function kf(p){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.i,hash:"SHA-256"},b,{name:"AES-GCM",length:256},true,["decrypt"])}
async function open(k){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.v)},k,u(D.c));const P=JSON.parse(new TextDecoder().decode(pt));
 const st=document.createElement("style");st.textContent=P.css;document.head.appendChild(st);document.getElementById("gs").remove();
 document.title=P.title;const l=document.createElement("link");l.rel="icon";l.href=P.fav;document.head.appendChild(l);
 document.body.innerHTML=P.html;const s=document.createElement("script");s.textContent=P.js;document.body.appendChild(s);}
(async()=>{try{const r=sessionStorage.getItem(SK);if(r){const k=await crypto.subtle.importKey("raw",u(r),"AES-GCM",true,["decrypt"]);await open(k)}}catch(e){try{sessionStorage.removeItem(SK)}catch(_){}}})();
document.getElementById("gf").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("gm");m.textContent="Opening…";
 try{const k=await kf(document.getElementById("gp").value.trim().toLowerCase());await open(k);
  try{const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k));sessionStorage.setItem(SK,btoa(String.fromCharCode(...raw)))}catch(_){}}
 catch(_){m.textContent="That passcode didn't work."}});})();
